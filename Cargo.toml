[package]
name = "rsread"
version = "0.1.5"
edition = "2021"
rust-version = "1.90"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
description = "Fast multi-language code reader: structure tree, syntax highlighting, duplicate detection and Git change markers for Python, Rust, Go and JavaScript"
license = "MIT"
repository = "https://github.com/cumulus13/rsread"
readme = "README.md"
keywords = ["code-analyzer", "syntax-highlighting", "git", "cli", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rsread"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
colored = "3"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
terminal_size = "0.4"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
unicode-width = "0.2"

# Clipboard: arboard has no Android backend, Termux uses termux-api instead (see src/clip.rs)
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
